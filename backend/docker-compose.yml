version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: subserve_postgres
    environment:
      POSTGRES_DB: JustShop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Khetha100%
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d JustShop"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: subserve_backend
    ports:
      - "9091:9091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/JustShop
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Khetha100%
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: